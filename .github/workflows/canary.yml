# uploads.github.com is undocumented, so this workflow probes it on demand.
# Keep it manual until a dedicated, least-privilege PAT is configured.
name: canary

on: workflow_dispatch

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # The automatic Actions token gets a 404 from the upload endpoint. Use a
      # dedicated PAT here; never reuse a personal token with broad access.
      - name: Upload a 1px probe
        env:
          GH_TOKEN: ${{ secrets.CANARY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CANARY_TOKEN is required for this manual probe."
            exit 1
          fi
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' \
            | base64 -d > "$RUNNER_TEMP/probe.png"
          node dist/cli.js "$RUNNER_TEMP/probe.png" --repo "$GITHUB_REPOSITORY" --url
