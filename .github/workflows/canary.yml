# uploads.github.com is undocumented, so it can stop working without anyone
# announcing it. This uploads a 1px image every night: a red run here means the
# endpoint moved, not that someone's code broke.
name: canary

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # The Actions GITHUB_TOKEN gets a 404 from the upload endpoint, so the
      # canary needs a PAT in the CANARY_TOKEN secret. Without one there is
      # nothing to test, and a red run every night would train everyone to
      # ignore it.
      - name: Upload a 1px probe
        env:
          GITHUB_TOKEN: ${{ secrets.CANARY_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "CANARY_TOKEN is not set, so there is no token that can reach the endpoint. Skipping."
            exit 0
          fi
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' \
            | base64 -d > probe.png
          node dist/cli.js probe.png --repo "$GITHUB_REPOSITORY" --url
